agent:
  module: omnirl.algorithms.ddpg
modules:
  learner:
    gamma: 0.99
    tau: 0.005
    actor_lr: 0.0003
    critic_lr: 0.0003
  memory:
    batch_size: 256
    warmup_size: 10000
    max_size: 300000
    replay_ratio: 1
  policy:
    action_noise: 0.1
    random_warmup: true
  network:
    actor:
      layer_type: MLP
      mlp_hidden_dims:
      - 256
      - 256
    critic:
      layer_type: MLP
      mlp_hidden_dims:
      - 256
      - 256
env:
  module: omnirl.envs.gymnasium
  id: BipedalWalker-v3
  render_mode: null
runner:
  ckpt_dir: results/algorithm_validation/bipedal_walker/ddpg-2
  eval_model: null
  num_learners: 1
  num_samplers: 1
  num_evaluators: 2
  num_episodes: 25
  max_updates: 500000
  save_interval: 3600
  log_interval: 60
  log_name: log.csv
  load_checkpoint: true
device:
  learner: gpu
seed:
  learner: 2
  sampler: 2
  evaluator: 2
