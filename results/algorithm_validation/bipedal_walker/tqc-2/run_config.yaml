agent:
  module: omnirl.algorithms.tqc
modules:
  learner:
    gamma: 0.99
    tau: 0.005
    alpha: 0.1
    target_entropy: null
    actor_lr: 0.0003
    critic_lr: 0.0003
    alpha_lr: 0.0003
    num_critics: 5
    num_quantiles: 25
    drop_per_net: 2
  memory:
    batch_size: 256
    warmup_size: 10000
    max_size: 300000
    replay_ratio: 1
  policy:
    random_warmup: true
  network:
    actor:
      mlp_hidden_dims:
      - 256
      - 256
      log_std_min: -20.0
      log_std_max: 2.0
    critic:
      mlp_hidden_dims:
      - 256
      - 256
env:
  module: omnirl.envs.gymnasium
  id: BipedalWalker-v3
  render_mode: null
runner:
  ckpt_dir: /root/project/HCB/GD2/GameRobot2/checkpoints/algorithm_validation/bipedal_walker/tqc-2
  eval_model: null
  num_learners: 1
  num_samplers: 1
  num_evaluators: 2
  num_episodes: 25
  max_updates: 500000
  save_interval: 3600
  log_interval: 60
  log_name: log.csv
  load_checkpoint: true
device:
  learner: gpu
seed:
  learner: 2
  sampler: 2
  evaluator: 2
