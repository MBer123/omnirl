agent:
  module: omnirl.algorithms.impala
modules:
  learner:
    gamma: 0.99
    ent_coef: 0.02
    vf_coef: 0.5
    rho_bar: 1.0
    c_bar: 1.0
    actor_lr: 0.0003
    critic_lr: 0.0003
    max_grad_norm: 0.5
  memory:
    unroll_length: 32
    max_chunks: 64
    store_log_probs: true
    track_version: false
  network:
    actor:
      mlp_hidden_dims:
      - 256
      - 256
      log_std_min: -20.0
      log_std_max: 2.0
    critic:
      mlp_hidden_dims:
      - 256
      - 256
env:
  module: omnirl.envs.gymnasium
  id: BipedalWalker-v3
  render_mode: null
runner:
  ckpt_dir: checkpoints/algorithm_validation/bipedal_walker/impala-2
  eval_model: null
  num_learners: 1
  num_samplers: 10
  num_evaluators: 2
  num_episodes: 25
  max_updates: 24415
  save_interval: 3600
  log_interval: 60
  log_name: log.csv
  load_checkpoint: true
device:
  learner: gpu
seed:
  learner: 2
  sampler: 2
  evaluator: 2
