agent:
  module: omnirl.algorithms.ppo
modules:
  learner:
    gamma: 0.99
    lambda_: 0.95
    ent_coef: 0.02
    vf_coef: 0.5
    k_epochs: 3
    num_minibatches: 8
    epsilon_clip: 0.1
    actor_lr: 0.0003
    critic_lr: 0.0003
    max_grad_norm: 0.5
  memory:
    unroll_length: 32
    max_chunks: 64
    store_log_probs: true
  network:
    actor:
      layer_type: MLP
      mlp_hidden_dims:
      - 256
      - 256
      log_std_min: -20.0
      log_std_max: 2.0
    critic:
      layer_type: MLP
      mlp_hidden_dims:
      - 256
      - 256
env:
  module: omnirl.envs.gymnasium
  id: BipedalWalker-v3
  render_mode: null
runner:
  ckpt_dir: results/algorithm_validation/bipedal_walker/ppo-1
  eval_model: null
  num_learners: 1
  num_samplers: 10
  num_evaluators: 2
  num_episodes: 25
  max_updates: 24415
  save_interval: 3600
  log_interval: 60
  log_name: log.csv
  load_checkpoint: true
device:
  learner: gpu
seed:
  learner: 1
  sampler: 1
  evaluator: 1
