agent:
  module: omnirl.algorithms.ppo
modules:
  learner:
    gamma: 0.99
    lambda_: 0.95
    ent_coef: 0.02
    vf_coef: 0.5
    k_epochs: 3
    num_minibatches: 8
    epsilon_clip: 0.1
    actor_lr: 0.0003
    critic_lr: 0.0003
    max_grad_norm: 0.5
  memory:
    unroll_length: 32
    max_chunks: 64
    store_log_probs: true
    track_version: true
  network:
    actor:
      mlp_hidden_dims:
      - 64
      - 64
    critic:
      mlp_hidden_dims:
      - 64
      - 64
env:
  module: omnirl.envs.rlcard
  id: blackjack
runner:
  ckpt_dir: checkpoints/environment_integration/rlcard/blackjack/ppo-2
  eval_model: null
  num_learners: 1
  num_samplers: 1
  num_evaluators: 10
  num_episodes: 5000
  max_updates: 500
  save_interval: 3600
  log_interval: 30
  log_name: log.csv
  load_checkpoint: true
device:
  learner: gpu
seed:
  learner: 2
  sampler: 2
  evaluator: 2
