agent:
  module: omnirl.algorithms.ppo
modules:
  learner:
    gamma: 0.99
    lambda_: 0.95
    ent_coef: 0.02
    vf_coef: 0.5
    k_epochs: 3
    num_minibatches: 8
    epsilon_clip: 0.1
    actor_lr: 0.0003
    critic_lr: 0.0003
    max_grad_norm: 0.5
  memory:
    unroll_length: 32
    max_chunks: 64
    store_log_probs: true
    track_version: true
  network:
    actor:
      layer_type: CNN
      conv_layers:
      - - 32
        - 8
        - 4
        - 0
      - - 64
        - 4
        - 2
        - 0
      conv_hidden_dims:
      - 256
    critic:
      layer_type: CNN
      conv_layers:
      - - 32
        - 8
        - 4
        - 0
      - - 64
        - 4
        - 2
        - 0
      conv_hidden_dims:
      - 256
env:
  module: omnirl.envs.vizdoom
  id: defend_the_center
  frame_skip: 4
  max_buttons_pressed: 1
  screen_resolution: RES_160X120
  screen_format: RGB24
  render_mode: null
runner:
  ckpt_dir: results/environment_integration/vizdoom/defend_the_center/ppo-0
  eval_model: null
  num_learners: 1
  num_samplers: 8
  num_evaluators: 5
  num_episodes: 20
  max_updates: 1000
  save_interval: 3600
  log_interval: 60
  log_name: log.csv
  load_checkpoint: true
device:
  learner: gpu
seed:
  learner: 0
  sampler: 0
  evaluator: 0
