agent:
  module: omnirl.algorithms.ppo
modules:
  learner:
    gamma: 0.99
    lambda_: 0.95
    ent_coef: 0.02
    vf_coef: 0.5
    k_epochs: 3
    num_minibatches: 8
    epsilon_clip: 0.1
    actor_lr: 0.0003
    critic_lr: 0.0003
    max_grad_norm: 0.5
  memory:
    unroll_length: 32
    max_chunks: 64
    store_log_probs: true
    track_version: true
  network:
    actor:
      mlp_hidden_dims:
      - 64
      - 64
    critic:
      mlp_hidden_dims:
      - 64
      - 64
env:
  module: omnirl.envs.sumo
  net_file: experiments/environment_integration/sumo/single_intersection/scenario/single-intersection.net.xml
  route_file: experiments/environment_integration/sumo/single_intersection/scenario/single-intersection.rou.xml
  num_seconds: 3600
  delta_time: 5
  yellow_time: 3
  min_green: 10
  reward_fn: diff-waiting-time
  sumo_warnings: false
  additional_sumo_cmd: --no-step-log
  render_mode: null
runner:
  ckpt_dir: checkpoints/environment_integration/sumo/single_intersection/ppo-0
  eval_model: null
  num_learners: 1
  num_samplers: 5
  num_evaluators: 5
  num_episodes: 4
  max_updates: 500
  save_interval: 3600
  log_interval: 60
  log_name: log.csv
  load_checkpoint: true
device:
  learner: gpu
seed:
  learner: 0
  sampler: 0
  evaluator: 0
