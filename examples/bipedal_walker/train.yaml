env:
  module: omnirl.envs.gymnasium
  id: BipedalWalker-v3
  render_mode: null

runner:
  ckpt_dir: checkpoints/bipedal_walker
  max_updates: 100
  prefetch_depth: 1
  save_interval: 60
  log_interval: 10
  log_name: log.csv
  load_checkpoint: true

learner:
  num_learners: 1
  device: cpu

sampler:
  num_samplers: 1
  num_envs_per_sampler: 4
  collection_fragment_length: 128
  num_sampler_gpus: 0
  num_samplers_per_gpu: 1

evaluator:
  num_evaluators: 1
  num_episodes_per_evaluator: 5
  num_evaluator_gpus: 0
  num_evaluators_per_gpu: 1

seed:
  learner: 0
  sampler: 0
  evaluator: 0
