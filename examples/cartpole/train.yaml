env:
  module: omnirl.envs.gymnasium
  id: CartPole-v1
  render_mode: null

runner:
  ckpt_dir: checkpoints/cartpole
  num_learners: 1
  num_samplers: 1
  num_envs_per_sampler: 4
  collection_fragment_length: 128
  num_evaluators: 1
  num_episodes: 5
  max_updates: 100
  prefetch_depth: 1
  save_interval: 60
  log_interval: 10
  log_name: log.csv
  load_checkpoint: true

device:
  learner: cpu

seed:
  learner: 0
  sampler: 0
  evaluator: 0
