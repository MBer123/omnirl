agent:
  module: omnirl.algorithms.on_policy.ppo

modules:
  learner:
    gamma: 0.99
    lambda_: 0.95
    ent_coef: 0.02
    vf_coef: 0.5
    k_epochs: 3
    num_minibatches: 8
    epsilon_clip: 0.1
    actor_lr: 0.0003
    critic_lr: 0.0003
    max_grad_norm: 0.5
    target_kl: 0.02

  memory:
    batch_size: 1024
    track_version: true

  network:
    actor:
      layer_type: MLP
      mlp_hidden_dims: [64, 64]
    critic:
      layer_type: MLP
      mlp_hidden_dims: [64, 64]
