agent:
  module: omnirl.algorithms.off_policy.c51_dqn

modules:
  learner:
    gamma: 0.99
    tau: 0.005
    lr: 0.0003
    max_grad_norm: 10
    num_atoms: 51
    v_min: -100
    v_max: 100

  memory:
    batch_size: 64
    warmup_size: 1000
    max_size: 100000
    replay_ratio: 32

  policy:
    epsilon_start: 1
    epsilon_end: 0.01
    decay_steps: 100000
    random_warmup: true
    num_atoms: 51
    v_min: -100
    v_max: 100

  network:
    layer_type: MLP
    mlp_hidden_dims: [64, 64]
