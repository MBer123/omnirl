agent:
  module: omnirl.algorithms.impala

modules:
  learner:
    gamma: 0.99
    ent_coef: 0.02
    vf_coef: 0.5
    rho_bar: 1
    c_bar: 1
    actor_lr: 0.0003
    critic_lr: 0.0003
    max_grad_norm: 0.5

  memory:
    unroll_length: 32
    max_chunks: 8
    track_version: false

  network:
    actor:
      layer_type: MLP
      mlp_hidden_dims: [64, 64]
      log_std_min: -20.0
      log_std_max: 2.0
    critic:
      layer_type: MLP
      mlp_hidden_dims: [64, 64]
