agent:
  module: omnirl.algorithms.tqc

modules:
  learner:
    gamma: 0.99
    tau: 0.005
    alpha: 0.1
    target_entropy: null
    actor_lr: 0.0003
    critic_lr: 0.0003
    alpha_lr: 0.0003
    num_critics: 5
    num_quantiles: 25
    drop_per_net: 2

  memory:
    batch_size: 64
    warmup_size: 1000
    max_size: 100000

  policy:
    random_warmup: true

  network:
    actor:
      layer_type: MLP
      mlp_hidden_dims: [64, 64]
      log_std_min: -20.0
      log_std_max: 2.0
    critic:
      layer_type: MLP
      mlp_hidden_dims: [64, 64]
