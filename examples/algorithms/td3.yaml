agent:
  module: omnirl.algorithms.off_policy.td3

modules:
  learner:
    gamma: 0.99
    tau: 0.005
    policy_noise: 0.2
    noise_clip: 0.5
    delay_time: 2
    actor_lr: 0.0003
    critic_lr: 0.0003

  memory:
    batch_size: 64
    warmup_size: 1000
    max_size: 100000

  policy:
    action_noise: 0.1
    random_warmup: true

  network:
    actor:
      layer_type: MLP
      mlp_hidden_dims: [64, 64]
    critic:
      layer_type: MLP
      mlp_hidden_dims: [64, 64]
