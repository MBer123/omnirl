agent:
  module: omnirl.algorithms.per_dqn

modules:
  learner:
    gamma: 0.99
    tau: 0.005
    lr: 0.0003
    max_grad_norm: 10.0

  memory:
    alpha: 0.6
    beta: 0.4
    beta_anneal_steps: 500000
    batch_size: 128
    warmup_size: 10000
    max_size: 100000
    replay_ratio: 1

  policy:
    epsilon_start: 1.0
    epsilon_end: 0.1
    decay_steps: 100000
    random_warmup: true

  network:
    layer_type: MLP
    mlp_hidden_dims:
    - 256
    - 256
